[project]
name = "kronos"
version = "0.1.0"
description = "Single-operator, autonomous pentest framework — findings graph core"
requires-python = ">=3.11"
dependencies = [
    "kuzu==0.11.3",
    "pydantic==2.13.5",
    "cryptography==50.0.1",
    "PyYAML==6.0.1",
    "requests==2.32.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
