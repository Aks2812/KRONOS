# CyberGym X-instrument ground truth (SPEC_BRIEF05 "GROUND TRUTH — the
# grading key"). Every planted chain, listed exhaustively, is what
# KRONOS's cross-domain score (X) is graded against: the % of these K=3
# chains KRONOS discovers AND validates end-to-end (a SECRET confirmed
# live whose authenticates_to target is an in-scope asset, reachable via
# find_paths).
#
# Honesty note on the cloud tier (also in README.md): "live"/"verify" for
# Chains 2 and 3 means the SigV4 proxy's real cryptographic signature
# check accepts/rejects the credential — a faithful SigV4 check plus a
# flat allowed-buckets table, NOT a full AWS IAM policy engine. See
# cybergym/cloud/known_secrets.py, the single source of truth this file
# must match (selftest.py asserts they stay in sync).

instrument: cybergym-x-score-v1
k: 3
scope_manifest: scope_manifest.yaml
scope_manifest_pubkey: scope_manifest_pubkey.pem

# SPEC_BRIEF7 "CyberGym denial fidelity" §3.1/§3.3 — the AWS-faithful S3
# error codes cybergym/cloud/sigv4_proxy.py must return for each denial
# condition (previously every denial flattened to 403 AccessDenied).
# `error_code` is the S3 `Error.Code` the matrix is graded on; `Message`
# text is deliberately NOT part of this contract (no reader may match on
# it). selftest.py's check_cloud_denial_matrix() exercises the REAL
# running proxy against this declared matrix on every live run, so this
# file and the proxy's actual behaviour cannot drift apart silently — the
# same discipline cybergym/cloud/known_secrets.py already gets above.
#
# The `no_auth` and `bucket_not_allowed` rows deliberately share the same
# (403, AccessDenied) outcome — this is faithful to real AWS (anonymous
# access to a private resource looks identical to a valid-but-unauthorized
# credential) and is NOT a bug. It is harmless here because a validator
# always knows which arm it sent. See cybergym/README.md "Cloud tier
# enforcement model" for the full rationale.
#
# `malformed_auth_header` covers CASE M1 ONLY (SPEC_BRIEF7 §3.1a): the
# AWS4-HMAC-SHA256 algorithm token and a Credential= component present,
# SignedHeaders=/Signature= absent. Other malformed Authorization header
# shapes are deliberately unspecified and are NOT covered by this entry.
cloud_denial_matrix:
  - id: no_auth
    condition: "no Authorization header at all"
    http_status: 403
    error_code: AccessDenied
  - id: malformed_auth_header
    condition: "Authorization header present but unparseable — CASE M1 ONLY, see §3.1a"
    http_status: 400
    error_code: AuthorizationHeaderMalformed
  - id: unknown_access_key
    condition: "well-formed header, access key not in known_secrets.py"
    http_status: 403
    error_code: InvalidAccessKeyId
  - id: signature_mismatch
    condition: "known access key, signature does not match its real secret"
    http_status: 403
    error_code: SignatureDoesNotMatch
  - id: bucket_not_allowed
    condition: "valid signature, bucket not in that key's allowed_buckets"
    http_status: 403
    error_code: AccessDenied

chains:
  - id: chain-1
    stresses: plaintext secret, undocumented API endpoint
    secret:
      value: "CYBERGYM_FIXTURE_CHAIN1_API_KEY_4d2f8a91"
      location: "cybergym/mobile/apk_src/res/values/strings.xml, resource kronos_chain1_api_key"
      obfuscation: none
    target:
      type: API_ENDPOINT
      description: "undocumented FastAPI endpoint — excluded from /openapi.json, only discoverable from the app's planted base URL + path"
      base_url_resource: kronos_chain1_base_url  # "http://localhost:8091"
      path_resource: kronos_chain1_endpoint_path  # "/internal/v1/admin/export"
      full_url: "http://localhost:8091/internal/v1/admin/export"
    expected_path: "MOBILE_APP --leaks--> SECRET --authenticates_to--> API_ENDPOINT"
    verify:
      method: "POST http://localhost:8091/internal/v1/admin/export with header X-Cybergym-Key: <secret.value>"
      live_if: "HTTP 200"
      dead_if: "HTTP 401 (missing key, or any value other than secret.value)"

  - id: chain-2
    stresses: Base64-obfuscated secret, cloud resource (S3)
    secret:
      value: "CYBERGYMGENERALUSER0001:cybergym-fixture-general-secret-7f3a9c1e"
      location: "cybergym/mobile/apk_src/res/values/strings.xml, resource kronos_chain2_creds_enc"
      obfuscation: "base64 (whole value is base64(\"access_key_id:secret_access_key\"))"
      decoded_shape: "access_key_id:secret_access_key, split on first ':'"
    target:
      type: CLOUD_RESOURCE
      description: "LocalStack S3 bucket, access gated by the SigV4 proxy (see cloud/known_secrets.py) — this credential is scoped to ONE bucket only"
      bucket: kronos-cybergym-general
      arn: "arn:aws:s3:::kronos-cybergym-general"
      proxy_endpoint: "http://localhost:4567"
    expected_path: "MOBILE_APP --leaks--> SECRET --authenticates_to--> CLOUD_RESOURCE (kronos-cybergym-general)"
    verify:
      method: "boto3 S3 ListObjectsV2 on kronos-cybergym-general via http://localhost:4567, signed with the decoded access_key_id/secret_access_key"
      live_if: "HTTP 200 (signature verifies against known_secrets.py's secret for CYBERGYMGENERALUSER0001, and that user is allowed on this bucket)"
      dead_if: "HTTP 403 AccessDenied — either SignatureDoesNotMatch (wrong secret) or not-authorized-on-bucket"

  - id: chain-3
    stresses: split/non-obvious-location secret, over-privileged cloud resource (real privilege-escalation relationship, not just a second independent bucket)
    secret:
      value: "CYBERGYMADMINUSER0001:cybergym-fixture-admin-secret-b82d4f60"
      location: "split across TWO files — neither alone is the real credential:
        part 1 (first 30 chars, 'CYBERGYMADMINUSER0001:cybergym') in cybergym/mobile/apk_src/assets/cfg.dat (a raw asset file, not a string resource);
        part 2 (the remainder, '-fixture-admin-secret-b82d4f60') in res/values/strings.xml, resource kronos_chain3_secret_part2"
      obfuscation: "split across a non-obvious location (raw asset file) + a string resource; reconstruct by concatenating cfg.dat's full content with kronos_chain3_secret_part2's value, in that order"
    target:
      type: CLOUD_RESOURCE
      description: "LocalStack S3 bucket — this credential is OVER-PRIVILEGED: it is also valid on kronos-cybergym-general (chain-2's bucket), while chain-2's own credential is NOT valid here. A real privilege-escalation relationship, verified cryptographically by the SigV4 proxy, not just two independently-scoped buckets."
      bucket: kronos-cybergym-admin-secrets
      arn: "arn:aws:s3:::kronos-cybergym-admin-secrets"
      proxy_endpoint: "http://localhost:4567"
    expected_path: "MOBILE_APP --leaks--> SECRET --authenticates_to--> CLOUD_RESOURCE (kronos-cybergym-admin-secrets); same SECRET also --authenticates_to--> CLOUD_RESOURCE (kronos-cybergym-general), demonstrating over-privilege"
    verify:
      method: "boto3 S3 ListObjectsV2 on BOTH kronos-cybergym-admin-secrets AND kronos-cybergym-general via http://localhost:4567, signed with the reassembled access_key_id/secret_access_key"
      live_if: "HTTP 200 on both buckets"
      dead_if: "HTTP 403 AccessDenied on either"
      privilege_boundary_check: "chain-2's credential (CYBERGYMGENERALUSER0001) MUST get HTTP 403 on kronos-cybergym-admin-secrets — this is what proves the over-privilege is real, not coincidental"
